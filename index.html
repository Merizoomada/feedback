<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback.merizo.com</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --teal: #00a99d;
            --teal-dark: #087c75;
            --teal-soft: #e9fbf8;
            --ink: #16302f;
            --muted: #738987;
            --line: #dce9e7;
            --panel: #ffffff;
            --page: #f4fbfa;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(0, 169, 157, 0.16), transparent 34rem),
                linear-gradient(135deg, #f7fffd 0%, #eef8f7 50%, #f9fbfb 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .chat-shell {
            width: min(100%, 440px);
            height: min(760px, calc(100vh - 48px));
            min-height: 560px;
            background: var(--panel);
            border: 1px solid rgba(0, 169, 157, 0.18);
            border-radius: 8px;
            box-shadow: 0 24px 80px rgba(8, 124, 117, 0.18);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--teal), #13c7b5);
            color: #fff;
            padding: 18px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.78);
            display: grid;
            place-items: center;
            background: #ecfffb;
            color: var(--teal-dark);
            flex: 0 0 auto;
            box-shadow: inset 0 -6px 0 rgba(0, 169, 157, 0.12);
        }

        .bot-avatar svg {
            width: 34px;
            height: 34px;
        }

        .header-copy {
            min-width: 0;
            flex: 1;
        }

        .header-copy h1 {
            margin: 0;
            font-size: 1.32rem;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .status {
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.92rem;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #67f5a6;
            box-shadow: 0 0 0 3px rgba(103, 245, 166, 0.22);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.24);
        }

        .chat-body {
            padding: 24px 18px;
            overflow-y: auto;
            background:
                linear-gradient(rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.94)),
                radial-gradient(circle at 20% 0%, rgba(0, 169, 157, 0.12), transparent 22rem);
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin: 0 0 16px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .mini-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--teal-soft);
            display: grid;
            place-items: center;
            color: var(--teal-dark);
            flex: 0 0 auto;
        }

        .mini-avatar svg {
            width: 22px;
            height: 22px;
        }

        .bubble-wrap {
            max-width: min(82%, 310px);
        }

        .speaker {
            margin: 0 0 6px 2px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .bubble {
            padding: 13px 15px;
            border-radius: 8px;
            line-height: 1.45;
            font-size: 0.98rem;
            overflow-wrap: anywhere;
        }

        .assistant .bubble {
            background: #f3f7f7;
            color: var(--ink);
            border-top-left-radius: 2px;
        }

        .user .bubble {
            background: var(--teal);
            color: #fff;
            border-top-right-radius: 2px;
            box-shadow: 0 8px 20px rgba(0, 169, 157, 0.22);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin: 8px 0 18px 44px;
        }

        .chip {
            border: 1px solid rgba(0, 169, 157, 0.45);
            background: #fff;
            color: var(--teal-dark);
            border-radius: 999px;
            padding: 10px 14px;
            min-height: 40px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .chip:hover {
            background: var(--teal-soft);
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            min-width: 54px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: pulse 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.14s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.28s;
        }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.34; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-3px); }
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
        }

        .composer input {
            min-width: 0;
            flex: 1;
            border: 1px solid transparent;
            border-radius: 8px;
            background: #f3f8f7;
            color: var(--ink);
            font: inherit;
            padding: 13px 14px;
            outline: none;
        }

        .composer input:focus {
            border-color: rgba(0, 169, 157, 0.5);
            background: #fff;
        }

        .send-button {
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: var(--teal);
            display: grid;
            place-items: center;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .send-button:hover {
            background: var(--teal-dark);
        }

        .send-button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        @media (max-width: 520px) {
            body {
                padding: 0;
            }

            .chat-shell {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                border-radius: 0;
                border: 0;
            }

            .bubble-wrap {
                max-width: 84%;
            }
        }
    </style>
</head>
<body>
    <main class="chat-shell" aria-label="Merizo AI support chat">
        <header class="chat-header">
            <div class="bot-avatar" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none" role="img">
                    <rect x="14" y="21" width="36" height="27" rx="8" fill="currentColor"/>
                    <rect x="21" y="29" width="22" height="11" rx="4" fill="#fff"/>
                    <circle cx="27" cy="34.5" r="2.7" fill="currentColor"/>
                    <circle cx="37" cy="34.5" r="2.7" fill="currentColor"/>
                    <path d="M32 21V12" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="32" cy="10" r="4" fill="currentColor"/>
                    <path d="M22 52h20" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="header-copy">
                <h1>Merizo AI</h1>
                <div class="status"><span class="status-dot"></span>Online now</div>
            </div>
            <div class="header-actions">
                <button class="icon-button" type="button" title="More options" aria-label="More options">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="5" cy="12" r="2"/>
                        <circle cx="12" cy="12" r="2"/>
                        <circle cx="19" cy="12" r="2"/>
                    </svg>
                </button>
                <button class="icon-button" type="button" title="Clear chat" aria-label="Clear chat" id="clearChat">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </header>

        <section class="chat-body" id="chatBody" aria-live="polite">
            <div class="message-row assistant">
                <div class="mini-avatar" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none">
                        <rect x="14" y="21" width="36" height="27" rx="8" fill="currentColor"/>
                        <rect x="21" y="29" width="22" height="11" rx="4" fill="#fff"/>
                        <circle cx="27" cy="34.5" r="2.7" fill="currentColor"/>
                        <circle cx="37" cy="34.5" r="2.7" fill="currentColor"/>
                        <path d="M32 21V12" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="32" cy="10" r="4" fill="currentColor"/>
                    </svg>
                </div>
                <div class="bubble-wrap">
                    <p class="speaker">Merizo AI</p>
                    <div class="bubble">Hi! I am your Merizo support assistant. How can I help with feedback, orders, services, or account questions?</div>
                </div>
            </div>
            <div class="chips" aria-label="Suggested questions">
                <button class="chip" type="button">Share feedback</button>
                <button class="chip" type="button">Talk to support</button>
                <button class="chip" type="button">Report a problem</button>
            </div>
        </section>

        <form class="composer" id="chatForm">
            <input id="userInput" type="text" autocomplete="off" placeholder="Reply to Merizo AI..." aria-label="Message Merizo AI">
            <button class="send-button" type="submit" aria-label="Send message" id="sendButton">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m4 12 15-7-5 14-3-6-7-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="m11 13 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
    </main>

    <script>
        const API_URL = "/api/chat";
        const SYSTEM_PROMPT = [
            "You are Merizo AI, a friendly support assistant on feedback.merizo.com.",
            "Help users with feedback, support, service questions, order issues, and account concerns.",
            "Keep replies short, helpful, and professional. Ask one clear follow-up question when needed."
        ].join(" ");

        const chatBody = document.getElementById("chatBody");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");
        const clearChat = document.getElementById("clearChat");
        const seedHtml = chatBody.innerHTML;
        const history = [];

        function botIcon() {
            return `
                <div class="mini-avatar" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none">
                        <rect x="14" y="21" width="36" height="27" rx="8" fill="currentColor"/>
                        <rect x="21" y="29" width="22" height="11" rx="4" fill="#fff"/>
                        <circle cx="27" cy="34.5" r="2.7" fill="currentColor"/>
                        <circle cx="37" cy="34.5" r="2.7" fill="currentColor"/>
                        <path d="M32 21V12" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="32" cy="10" r="4" fill="currentColor"/>
                    </svg>
                </div>`;
        }

        function escapeHtml(value) {
            return value.replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function scrollToLatest() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function addMessage(role, text) {
            const row = document.createElement("div");
            row.className = `message-row ${role}`;
            row.innerHTML = role === "assistant"
                ? `${botIcon()}<div class="bubble-wrap"><p class="speaker">Merizo AI</p><div class="bubble">${escapeHtml(text)}</div></div>`
                : `<div class="bubble-wrap"><div class="bubble">${escapeHtml(text)}</div></div>`;
            chatBody.appendChild(row);
            scrollToLatest();
            return row;
        }

        function addTyping() {
            const row = document.createElement("div");
            row.className = "message-row assistant";
            row.innerHTML = `${botIcon()}<div class="bubble-wrap"><p class="speaker">Merizo AI</p><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div></div>`;
            chatBody.appendChild(row);
            scrollToLatest();
            return row;
        }

        function fallbackReply(message) {
            const lower = message.toLowerCase();
            if (lower.includes("feedback")) {
                return "Thanks for sharing feedback. What should we improve first: speed, support, pricing, or the product experience?";
            }
            if (lower.includes("problem") || lower.includes("issue") || lower.includes("error")) {
                return "I can help log that. Please tell me what happened, when it started, and any error message you saw.";
            }
            if (lower.includes("support") || lower.includes("help")) {
                return "Sure. Tell me what you need help with and I will guide you to the next step.";
            }
            return "Thanks for reaching out. Can you share a little more detail so I can help you better?";
        }

        async function getAssistantReply(message) {
            history.push({ role: "user", parts: [{ text: message }] });
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message,
                    systemPrompt: SYSTEM_PROMPT,
                    history: history.slice(-8)
                })
            });

            if (!response.ok) {
                throw new Error(`Assistant API failed with ${response.status}`);
            }

            const data = await response.json();
            const reply = data?.reply?.trim();

            if (!reply) {
                throw new Error("Assistant API returned an empty response");
            }

            history.push({ role: "model", parts: [{ text: reply }] });
            return reply;
        }

        async function handleMessage(message) {
            addMessage("user", message);
            const typing = addTyping();
            sendButton.disabled = true;

            try {
                const reply = await getAssistantReply(message);
                typing.remove();
                addMessage("assistant", reply);
            } catch (error) {
                typing.remove();
                addMessage("assistant", fallbackReply(message));
            } finally {
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        chatForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const message = userInput.value.trim();
            if (!message || sendButton.disabled) return;
            userInput.value = "";
            handleMessage(message);
        });

        chatBody.addEventListener("click", (event) => {
            const chip = event.target.closest(".chip");
            if (!chip) return;
            handleMessage(chip.textContent.trim());
        });

        clearChat.addEventListener("click", () => {
            history.length = 0;
            chatBody.innerHTML = seedHtml;
            userInput.focus();
        });
    </script>
</body>
</html>
